  <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
    <filter id="lg-lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="9" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="1.4" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lg-lens-strong" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="4" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="40" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div id="app">
    
    <div id="titlebar">
      <div id="tab-strip" class="tab-strip"></div>
      <div class="win-ctrl">
        <button class="win-btn" id="win-min" title="最小化" tabindex="-1"><svg class="ico"><use href="#i-min"/></svg></button>
        <button class="win-btn" id="win-max" title="最大化" tabindex="-1"><svg class="ico"><use href="#i-max"/></svg></button>
        <button class="win-btn win-close" id="win-close" title="关闭" tabindex="-1"><svg class="ico"><use href="#i-close"/></svg></button>
      </div>
    </div>

    
    <header id="toolbar">
      <div class="tb-group tb-nav">
        <button class="tb-btn" id="btn-back" title="后退  (Alt + ←)" disabled>
          <svg class="ico"><use href="#i-back"/></svg>
        </button>
        <button class="tb-btn" id="btn-forward" title="前进  (Alt + →)" disabled>
          <svg class="ico"><use href="#i-forward"/></svg>
        </button>
        <button class="tb-btn" id="btn-reload" title="刷新  (Ctrl + R)">
          <svg class="ico"><use href="#i-reload"/></svg>
        </button>
      </div>

      <div id="tb-extra-left"></div>

      <div id="omnibox">
        <div class="omni-shell" id="omni-shell">
          <span class="omni-site" id="omni-site">
            <svg class="ico"><use href="#i-globe"/></svg>
          </span>
          <input id="omni-input" type="text" spellcheck="false" autocomplete="off"
                 placeholder="搜索或输入网址" aria-label="地址栏" />
          <button class="omni-action" id="btn-omni-clear" title="清空" hidden>
            <svg class="ico"><use href="#i-close"/></svg>
          </button>
        </div>
        <div id="omni-suggest" class="suggest" hidden></div>
      </div>

      <div class="tb-group tb-right">
        <div id="plugin-buttons" class="plugin-buttons"></div>
        <button class="tb-btn dl-btn" id="btn-download" title="下载内容  (Ctrl + J)">
          <svg class="ico"><use href="#i-download"/></svg>
          <span class="dl-badge" id="dl-badge" hidden></span>
        </button>
        <button class="tb-btn" id="btn-menu" title="菜单">
          <svg class="ico"><use href="#i-more"/></svg>
        </button>
      </div>
    </header>

    
    <main id="stage">
      <div id="loading-bar" hidden><i></i></div>

      
      <section id="home" aria-label="新标签页"></section>

      
      <div id="page-error" class="page-error" hidden>
        <div class="pe-icon"><svg class="ico"><use href="#i-globe"/></svg></div>
        <h2 id="pe-title">无法访问此网站</h2>
        <p id="pe-detail"></p>
        <div class="pe-actions">
          <button class="btn btn-primary" id="pe-retry">重新加载</button>
          <button class="btn" id="pe-home">回到首页</button>
        </div>
      </div>

    </main>

    
    <div id="overlay-root"></div>
    <div id="panel-layer"></div>
    <div id="toasts"></div>
    <div id="drop-veil" hidden>
      <div class="drop-card">
        <svg class="ico"><use href="#i-puzzle"/></svg>
        <strong>松开以安装插件</strong>
        <span>支持 .zip 格式，安装后立即生效</span>
      </div>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/view.js"></script>
  <script src="js/omnibox.js"></script>
  <script src="js/overlays.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
